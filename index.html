<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Talk, don't type. Local speech-to-text that auto-formats your rambling into publish-ready blog posts." />
    <meta name="theme-color" content="#f3eee4" />
    <!-- Apply the saved theme before first paint to avoid a flash of the wrong colours. -->
    <script>
      try {
        const t = localStorage.getItem('autoformat:theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch {}
    </script>
    <title>AutoFormat · talk it out, publish it clean</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
